<!DOCTYPE html>
<html lang="hy">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'" />
  <title>Սպասում է թույլտվության</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #1c2430;
      --muted: #5d6b7c;
      --line: #d7dee8;
      --paper: #f4f7fb;
      --card: #ffffff;
      --amber: #9a6700;
      --blue: #1d4e89;
      --red: #a32626;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: "Segoe UI", "Arial Unicode MS", sans-serif;
      color: var(--ink);
      background: var(--paper);
      padding: 24px;
    }
    .card {
      width: min(560px, 100%);
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 28px 24px;
    }
    h1 { margin: 0 0 8px; font-size: 1.35rem; }
    p { margin: 0 0 10px; color: var(--muted); line-height: 1.45; }
    .status { font-weight: 650; color: var(--amber); margin-top: 16px; }
    .status.blocked { color: var(--red); }
    .status.allowed { color: #0f7b4c; }
    .meta {
      margin-top: 18px;
      padding-top: 14px;
      border-top: 1px solid var(--line);
      font-size: 0.92rem;
      word-break: break-all;
    }
    .meta div { margin-bottom: 6px; }
    .label { color: var(--muted); display: inline-block; min-width: 140px; }
    .spinner {
      width: 28px;
      height: 28px;
      border: 3px solid var(--line);
      border-top-color: var(--blue);
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
      margin-bottom: 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="card">
    <div class="spinner" id="spinner"></div>
    <h1>Hospital Desktop</h1>
    <p id="message">Ստուգվում է թույլտվությունը կառավարման սերվերի հետ…</p>
    <p class="status" id="status">սպասման մեջ</p>
    <div class="meta">
      <div><span class="label">Project</span> <span id="project">—</span></div>
      <div><span class="label">PC</span> <span id="machine">—</span></div>
      <div><span class="label">Windows user</span> <span id="user">—</span></div>
      <div><span class="label">MAC</span> <span id="mac">—</span></div>
      <div><span class="label">Local IP</span> <span id="local-ip">—</span></div>
      <div><span class="label">Public IP</span> <span id="ip">—</span></div>
    </div>
  </div>
  <script src="waiting.js"></script>
</body>
</html>
